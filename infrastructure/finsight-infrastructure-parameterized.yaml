AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FinSight Cloud-Based Financial Risk Intelligence Platform infrastructure.
  Creates the AWS infrastructure only. Lambda functions contain placeholder
  code; replace the placeholder code manually with the Python files from GitHub.

Parameters:
  Environment:
    Type: String
    Default: Test
    Description: Deployment environment/prefix, for example Test, TeamA, or Demo.
    AllowedPattern: '^[A-Za-z0-9-]+$'

  FinanceEmail:
    Type: String
    Default: ""
    Description: Optional email address for finance-review SNS notifications.

Resources:

  # =========================================================
  # KMS
  # =========================================================

  FinSightDataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer managed encryption key for FinSight project data.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowSNSServiceUse
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Tags:
        - Key: Project
          Value: FinSight

  FinSightDataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/finsight-${Environment}-data
      TargetKeyId: !Ref FinSightDataKey

  FinSightSNSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for FinSight SNS data.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowSNSUse
            Effect: Allow
            Principal:
              AWS: '*'
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
              - kms:CreateGrant
              - kms:ListGrants
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
                kms:ViaService: !Sub sns.${AWS::Region}.amazonaws.com

  # =========================================================
  # DynamoDB
  # =========================================================

  PaymentRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub FinSight-${Environment}-PaymentRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt FinSightDataKey.Arn
      Tags:
        - Key: Project
          Value: FinSight
        - Key: Environment
          Value: Dev

  RiskAssessmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub FinSight-${Environment}-RiskAssessments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt FinSightDataKey.Arn
      Tags:
        - Key: Project
          Value: FinSight
        - Key: Environment
          Value: Dev

  ApprovalWorkflowTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub FinSight-${Environment}-ApprovalWorkflow
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt FinSightDataKey.Arn
      Tags:
        - Key: Project
          Value: FinSight
        - Key: Environment
          Value: Dev

  VendorBehaviourProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub FinSight-${Environment}-VendorBehaviourProfiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vendor_id
          AttributeType: S
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: vendor_id
          KeyType: HASH
        - AttributeName: account_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt FinSightDataKey.Arn
      Tags:
        - Key: Project
          Value: FinSight
        - Key: Environment
          Value: Dev

  HistoricalTransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub FinSight-${Environment}-HistoricalTransactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transaction_id
          AttributeType: S
        - AttributeName: vendor_account_key
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: transaction_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: vendor_account_index
          KeySchema:
            - AttributeName: vendor_account_key
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt FinSightDataKey.Arn
      Tags:
        - Key: Project
          Value: FinSight
        - Key: Environment
          Value: Dev

  # =========================================================
  # SNS
  # =========================================================

  FinanceReviewTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub FinSight-${Environment}-FinanceReview
      DisplayName: identified Risky Transaction
      KmsMasterKeyId: !Ref FinSightSNSKey
      Tags:
        - Key: Project
          Value: FinSight

  FinanceReviewSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasFinanceEmail
    Properties:
      TopicArn: !Ref FinanceReviewTopic
      Protocol: email
      Endpoint: !Ref FinanceEmail

  # =========================================================
  # IAM ROLES
  # =========================================================

  PaymentRequestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub FinSight-${Environment}-PaymentRequestLambda-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PaymentRequestAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt PaymentRequestsTable.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RiskEngineFunction.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt FinSightDataKey.Arn

  RiskEngineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub FinSight-${Environment}-RiskEngineLambda-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RiskEngineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  - !GetAtt PaymentRequestsTable.Arn
                  - !GetAtt VendorBehaviourProfilesTable.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  - !GetAtt RiskAssessmentsTable.Arn
                  - !GetAtt HistoricalTransactionsTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref FinanceReviewTopic
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt FinSightDataKey.Arn

  VBPUpdateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub FinSight-${Environment}-VBPUpdateLambda-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: VBPUpdateAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  - !GetAtt HistoricalTransactionsTable.Arn
                  - !GetAtt VendorBehaviourProfilesTable.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt VendorBehaviourProfilesTable.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${HistoricalTransactionsTable.Arn}/index/vendor_account_index
              - Effect: Allow
                Action:
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:DescribeStream
                  - dynamodb:ListStreams
                Resource: !GetAtt HistoricalTransactionsTable.StreamArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt FinSightDataKey.Arn

  ApprovalWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub FinSight-${Environment}-ApprovalWorkflowLambda-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApprovalWorkflowAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt RiskAssessmentsTable.Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt PaymentRequestsTable.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  - !GetAtt HistoricalTransactionsTable.Arn
                  - !GetAtt ApprovalWorkflowTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt FinSightDataKey.Arn

  GetPendingReviewsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub FinSight-${Environment}-GetPendingReviewsLambda-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GetPendingReviewsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt RiskAssessmentsTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt FinSightDataKey.Arn

  DashboardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub FinSight-${Environment}-Dashboard-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DashboardAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt HistoricalTransactionsTable.Arn
                  - !GetAtt RiskAssessmentsTable.Arn
                  - !GetAtt PaymentRequestsTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt FinSightDataKey.Arn

  # =========================================================
  # LAMBDA FUNCTIONS
  # Placeholder code only. Replace manually from GitHub.
  # =========================================================

  PaymentRequestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub FinSight-${Environment}-PaymentRequest
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt PaymentRequestRole.Arn
      Timeout: 3
      MemorySize: 128
      Environment:
        Variables:
          PAYMENT_REQUEST_TABLE: !Ref PaymentRequestsTable
          RISK_ENGINE_FUNCTION_ARN: !GetAtt RiskEngineFunction.Arn
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 501, "body": "Replace placeholder with GitHub Lambda code."}

  RiskEngineFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub FinSight-${Environment}-RiskEngine
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt RiskEngineRole.Arn
      Timeout: 3
      MemorySize: 128
      Environment:
        Variables:
          PAYMENT_REQUEST_TABLE: !Ref PaymentRequestsTable
          VBP_TABLE: !Ref VendorBehaviourProfilesTable
          RISK_ASSESSMENT_TABLE: !Ref RiskAssessmentsTable
          HISTORICAL_TABLE: !Ref HistoricalTransactionsTable
          SNS_TOPIC_ARN: !Ref FinanceReviewTopic
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 501, "body": "Replace placeholder with GitHub Lambda code."}

  VBPUpdateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub FinSight-${Environment}-VBPUpdate
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt VBPUpdateRole.Arn
      Timeout: 3
      MemorySize: 128
      Environment:
        Variables:
          HISTORICAL_TABLE: !Ref HistoricalTransactionsTable
          VBP_TABLE: !Ref VendorBehaviourProfilesTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 501, "body": "Replace placeholder with GitHub Lambda code."}

  ApprovalWorkflowFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub FinSight-${Environment}-ApprovalWorkflow
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt ApprovalWorkflowRole.Arn
      Timeout: 3
      MemorySize: 128
      Environment:
        Variables:
          RISK_ASSESSMENT_TABLE: !Ref RiskAssessmentsTable
          PAYMENT_REQUEST_TABLE: !Ref PaymentRequestsTable
          APPROVAL_TABLE: !Ref ApprovalWorkflowTable
          HISTORICAL_TABLE: !Ref HistoricalTransactionsTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 501, "body": "Replace placeholder with GitHub Lambda code."}

  GetPendingReviewsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub FinSight-${Environment}-GetPendingReviewsLambda
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt GetPendingReviewsRole.Arn
      Timeout: 3
      MemorySize: 128
      Environment:
        Variables:
          RISK_ASSESSMENT_TABLE: !Ref RiskAssessmentsTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 501, "body": "Replace placeholder with GitHub Lambda code."}

  DashboardFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub FinSight-${Environment}-Dashboard
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt DashboardRole.Arn
      Timeout: 3
      MemorySize: 128
      Environment:
        Variables:
          HISTORICAL_TABLE: !Ref HistoricalTransactionsTable
          RISK_ASSESSMENT_TABLE: !Ref RiskAssessmentsTable
          PAYMENT_REQUEST_TABLE: !Ref PaymentRequestsTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 501, "body": "Replace placeholder with GitHub Lambda code."}

  # =========================================================
  # DYNAMODB STREAM -> VBP UPDATE
  # =========================================================

  VBPUpdateEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn:
      - VBPUpdateFunction
      - VBPUpdateRole
    Properties:
      EventSourceArn: !GetAtt HistoricalTransactionsTable.StreamArn
      FunctionName: !GetAtt VBPUpdateFunction.Arn
      StartingPosition: LATEST
      BatchSize: 1
      Enabled: true
      MaximumRetryAttempts: -1

  # =========================================================
  # API GATEWAY HTTP API
  # =========================================================

  FinSightApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: FinSight-API
      ProtocolType: HTTP
      RouteSelectionExpression: '$request.method $request.path'
      IpAddressType: ipv4

  PaymentRequestIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FinSightApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt PaymentRequestFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  GetPendingReviewsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FinSightApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt GetPendingReviewsFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  ApprovalWorkflowIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FinSightApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt ApprovalWorkflowFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  DashboardIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FinSightApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt DashboardFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  PaymentRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FinSightApi
      RouteKey: 'POST /payment-request'
      Target: !Sub integrations/${PaymentRequestIntegration}

  GetPendingReviewsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FinSightApi
      RouteKey: 'GET /finance/reviews'
      Target: !Sub integrations/${GetPendingReviewsIntegration}

  ApprovalWorkflowRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FinSightApi
      RouteKey: 'POST /finance/review'
      Target: !Sub integrations/${ApprovalWorkflowIntegration}

  DashboardRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FinSightApi
      RouteKey: 'GET /dashboard'
      Target: !Sub integrations/${DashboardIntegration}

  PaymentRequestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PaymentRequestFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${FinSightApi}/*/*/payment-request

  GetPendingReviewsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt GetPendingReviewsFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${FinSightApi}/*/*/finance/reviews

  ApprovalWorkflowPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ApprovalWorkflowFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${FinSightApi}/*/*/finance/review

  DashboardPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt DashboardFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${FinSightApi}/*/*/dashboard

Conditions:
  HasFinanceEmail: !Not [!Equals [!Ref FinanceEmail, ""]]

Outputs:
  ApiBaseUrl:
    Description: Base URL for the FinSight HTTP API.
    Value: !GetAtt FinSightApi.ApiEndpoint

  PaymentRequestEndpoint:
    Description: Payment request API endpoint.
    Value: !Sub '${FinSightApi.ApiEndpoint}/payment-request'

  PendingReviewsEndpoint:
    Description: Pending finance reviews endpoint.
    Value: !Sub '${FinSightApi.ApiEndpoint}/finance/reviews'

  ApprovalWorkflowEndpoint:
    Description: Finance approval/rejection endpoint.
    Value: !Sub '${FinSightApi.ApiEndpoint}/finance/review'

  DashboardEndpoint:
    Description: Dashboard data endpoint.
    Value: !Sub '${FinSightApi.ApiEndpoint}/dashboard'

  PaymentRequestsTableName:
    Description: Payment requests DynamoDB table name.
    Value: !Ref PaymentRequestsTable

  RiskAssessmentsTableName:
    Description: Risk assessments DynamoDB table name.
    Value: !Ref RiskAssessmentsTable

  HistoricalTransactionsTableName:
    Description: Historical transactions DynamoDB table name.
    Value: !Ref HistoricalTransactionsTable

  VBPTableName:
    Description: Vendor behaviour profiles DynamoDB table name.
    Value: !Ref VendorBehaviourProfilesTable

  FinanceReviewTopicArn:
    Description: SNS topic used for finance review notifications.
    Value: !Ref FinanceReviewTopic

  DataKmsKeyArn:
    Description: FinSight data encryption KMS key ARN.
    Value: !GetAtt FinSightDataKey.Arn
